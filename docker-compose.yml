services:

  broker:
    image: apache/kafka:3.8.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "gTBb85_WRXu6oQgq-brTQw"
    volumes:
      - kafka_data:/var/lib/kafka/data

  central:
    build: ./WM_Central
    container_name: central
    command: ["5000", "broker", "29092"]
    ports:
      - "5000:5000"
    volumes:
      - central_data:/data
    depends_on:
      - broker
    restart: unless-stopped

  ws01-monitor:
    build: ./WM_WS/WM_M
    container_name: ws01-monitor
    command: ["6001", "central", "5000", "WS-01"]
    stdin_open: true
    tty: true
    depends_on: [central]
    restart: on-failure

  ws01-engine:
    build: ./WM_WS/WM_E
    container_name: ws01-engine
    command: ["broker", "29092", "ws01-monitor", "6001"]
    stdin_open: true
    tty: true
    depends_on: [ws01-monitor]
    restart: on-failure
  fo01:
    build: ./WM_FO
    container_name: fo01
    command: ["broker", "29092","OP-01"]
    stdin_open: true
    tty: true
    depends_on: [central]
    restart: "no"
volumes:
  kafka_data:
  central_data: